name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-14 is retired Nov 2, 2026 (actions/runner-images#13518).
    # goreleaser builds darwin/arm64 + darwin/amd64 natively on an Apple
    # Silicon runner; macos-15 (Sequoia, arm64) is the current stable.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `brews:` renders its token from HOMEBREW_TAP_GITHUB_TOKEN. When that
      # secret is absent the token renders as an empty string, the tap push
      # fails with a 401, and the whole release dies with it -- an empty token
      # is not treated as "not configured". So decide up front and skip the
      # pipe explicitly, which lets the GitHub release succeed on its own.
      - name: Decide whether the tap can be updated
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "flags=--skip=homebrew" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_GITHUB_TOKEN is not set; releasing without a tap update"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ steps.tap.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
